<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cut Trainer sounds</title>
<style>
  :root{--bg:#eef2f5;--ink:#10283d;--muted:#5b6b78;--card:#fff;--line:#d5dde3;--accent:#1f6fb2}
  @media (prefers-color-scheme: dark){:root{--bg:#0f1720;--ink:#e6eef3;--muted:#9fb3c1;--card:#17222d;--line:#2a3845;--accent:#5aa9e6}}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding:20px 16px 40px}
  h1{font-size:24px;margin:0 0 4px}
  p{margin:0 0 16px;color:var(--muted)}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .card h2{margin:0 0 2px;font-size:18px}
  .card small{display:block;color:var(--muted);margin-bottom:10px}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  button{font:600 14px system-ui,sans-serif;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer}
  button:active{transform:scale(.97)}
  button.seq{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<h1>Cut Trainer sounds</h1>
<p>The sounds the trainer plays now. Tap to listen.</p>
<div class="grid">
  <div class="card"><h2>Shot</h2><small>Two sounds per shot: the contact, then what the object ball does</small>
    <div class="row">
      <button data-p="cue">Cue strike</button><button data-p="click">Contact</button><button data-p="drop">Pocket</button><button data-p="rail">Rail</button><button data-p="jaw">Jaw</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="seq" data-p="make">▶ Make</button><button class="seq" data-p="miss">▶ Miss</button><button class="seq" data-p="jawshot">▶ Jaw rattle</button>
    </div>
  </div>
  <div class="card"><h2>Streaks &amp; grades</h2><small>The only chimes left; a streak chime plays instead of the shot sounds</small>
    <div class="row">
      <button data-p="streak">Streak</button><button data-p="streakEnd">Streak over</button><button data-p="levelup">Level up</button><button data-p="leveldown">Down a grade</button>
    </div>
  </div>
</div>
<script>
// Copied from index.html so this page plays exactly what the trainer plays.
let actx = null, noiseBuf = null;
function audioCtx(){ if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; try{ actx = new AC({latencyHint:'interactive'}); }catch(e){ actx = new AC(); } } if(actx.state === 'suspended') actx.resume(); return actx; }
const semis = (f, n)=>f*Math.pow(2, n/12);
function noise(){ if(!noiseBuf){ noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate); const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1; } return noiseBuf; }
function sfxNoise(out, at, dur, type, freq, q, gain){
  const t = actx.currentTime + at, src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = noise(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(out); src.start(t, Math.random()*0.5); src.stop(t + dur + 0.02);
}
function sfxTone(out, at, dur, f0, f1, gain, type){
  const t = actx.currentTime + at, o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); if(f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.02);
}
const SFX = {
  cue:    (o, t, v)=>{ sfxTone(o, t, .06, 760, 520, .55*v); sfxTone(o, t, .04, 1520, 1100, .14*v, 'triangle'); sfxNoise(o, t, .012, 'bandpass', 2400, 1.2, .3*v); },   // a hollow 'ponc'
  click:  (o, t, v)=>{ sfxTone(o, t, .12, 1175, 0, .55*v); sfxTone(o, t, .08, 1760, 0, .3*v); sfxTone(o, t, .025, 2349, 0, .12*v, 'triangle'); },
  drop:   (o, t, v)=>{ sfxTone(o, t, .14, 405, 127, .8*v, 'triangle'); },
  rail:   (o, t, v)=>{ sfxNoise(o, t, .08, 'lowpass', 500, .9, .6*v); sfxTone(o, t, .1, 140, 90, .6*v); },
  jaw:    (o, t, v)=>{ sfxTone(o, t, .06, 430, 300, .6*v, 'triangle'); sfxTone(o, t + .08, .28, 220, 90, .55*v); },
};
function tableSounds(plan){
  audioCtx();
  const bus = actx.createGain(); bus.gain.value = 0.55;
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000;
  const dly = actx.createDelay(); dly.delayTime.value = 0.08; const fb = actx.createGain(); fb.gain.value = 0.16;
  bus.connect(lp); lp.connect(actx.destination); lp.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(actx.destination);
  plan.forEach(([t, kind])=>SFX[kind](bus, t, 1));
}
function audioOut(level){
  audioCtx();
  const out = actx.createGain(); out.gain.value = level;
  const dly = actx.createDelay(); dly.delayTime.value = 0.09;
  const fb = actx.createGain(); fb.gain.value = 0.18;
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5500;
  out.connect(lp); lp.connect(actx.destination); lp.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(actx.destination);
  return out;
}
function tone(out, freq, at, dur, gain, glideTo){
  const t = actx.currentTime + at;
  [[1, 1], [2, 0.12]].forEach(([mult, amp])=>{
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(freq*mult, t);
    if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo*mult, t + dur*0.8);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain*amp, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.05);
  });
}
const CHIMES = {
  streak: ()=>{ const o = audioOut(0.2), r = 659.25; [0, 4, 7, 12].forEach((n,i)=>tone(o, semis(r, n), i*0.055, i===3 ? 0.42 : 0.2, i===3 ? 1 : 0.85)); },
  streakEnd: ()=>{ const o = audioOut(0.22); [12, 7, 3, 0].forEach((n,i)=>tone(o, semis(440, n), i*0.09, i===3 ? 0.55 : 0.22, 0.85, i===3 ? semis(440,-2) : 0)); },
  levelup: ()=>{ const o = audioOut(0.2), C = 523.25; [[0,0,.15],[.13,4,.15],[.26,7,.15],[.39,12,.34],[.78,7,.15],[.93,12,1.5],[.93,16,1.5],[.93,19,1.5]].forEach(([t,n,d])=>tone(o, semis(C,n), t, d, n > 12 ? 0.55 : 0.9)); },
  leveldown: ()=>{ const o = audioOut(0.2); [[0,7,.22],[.2,3,.22],[.4,0,.7]].forEach(([t,n,d])=>tone(o, semis(392,n), t, d, 0.8)); },
};
const PLAYS = {
  cue: [[0,'cue']], click: [[0,'click']], drop: [[0,'drop']], rail: [[0,'rail']], jaw: [[0,'jaw']],
  make: [[0,'cue'],[.35,'click'],[.95,'drop']], miss: [[0,'cue'],[.35,'click'],[.95,'rail']], jawshot: [[0,'cue'],[.35,'click'],[.95,'jaw']],
};
document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  const k = b.dataset.p;
  if(PLAYS[k]) tableSounds(PLAYS[k]); else if(CHIMES[k]){ audioCtx(); CHIMES[k](); }
});
</script>
</body>
</html>
