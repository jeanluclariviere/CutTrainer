<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d151b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Cut Trainer Live</title>
<style>
:root{--bg:#0d151b;--surface:#15212a;--ink:#e2eaef;--muted:#8fa1ad;--line:#26343e;--accent:#5aaee6;--good:#5cc27c;--bad:#ef7a63;--gold:#ffd34d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.intro{max-width:560px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:28px;margin:0 0 14px}
.intro p{color:var(--muted);margin:8px 0}
.btn{font:600 16px system-ui,sans-serif;border:0;border-radius:12px;padding:14px 18px;background:var(--accent);color:#08131b;cursor:pointer}
.btn:disabled{opacity:.45}
.btn.ghost{background:rgba(13,21,27,.8);color:var(--ink);border:1px solid rgba(255,255,255,.18)}
.btn.small{padding:9px 12px;font-size:14px}
#support{margin-top:14px;font-size:14px;color:var(--muted)}
#support.bad{color:var(--bad)}
a{color:var(--accent)}

/* AR overlay, drawn over the camera view */
#overlay{position:fixed;inset:0;display:none}
#overlay.on{display:block}
#draw{position:absolute;inset:0;width:100%;height:100%}
#taplayer{position:absolute;inset:0}
.top,.bottom{position:absolute;left:0;right:0;padding:10px 12px;display:flex;gap:8px;pointer-events:none}
.top{top:0;padding-top:max(56px, calc(12px + env(safe-area-inset-top)));align-items:flex-start}   /* clear of the phone's status bar, which AR mode draws over */
.bottom{bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom));flex-direction:column}
.top > *,.bottom > *{pointer-events:auto}
.status{flex:1;background:rgba(13,21,27,.8);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.35}
.status b{color:var(--gold)}
.steps{display:flex;gap:4px;margin-top:6px}
.steps i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.18)}
.steps i.done{background:var(--accent)}
.readout{background:rgba(13,21,27,.85);border-radius:12px;padding:10px 12px;display:none}
.readout.on{display:block}
.readout .big{font:700 22px system-ui,sans-serif}
.readout .ok{color:var(--good)} .readout .no{color:var(--bad)}
.readout .sub{color:var(--muted);font-size:14px}
.answers{display:none;grid-template-columns:repeat(5,1fr);gap:6px}
.answers.on{display:grid}
.answers button{font:700 22px system-ui,sans-serif;padding:12px 0;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(21,33,42,.92);color:var(--ink)}
.answers button.right{border-color:var(--good);background:rgba(92,194,124,.3)}
.answers button.wrong{border-color:var(--bad);background:rgba(239,122,99,.3)}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(13,21,27,.88);padding:10px 14px;border-radius:10px;font-size:14px;pointer-events:none;opacity:0;transition:opacity .2s;max-width:80%;text-align:center}
.toast.on{opacity:1}
#dbg{position:absolute;right:10px;top:150px;width:120px;height:120px;border:1px solid #fff;display:none;image-rendering:pixelated}
</style>
</head>
<body>
<div class="intro" id="intro">
  <h1>Cut Trainer Live</h1>
  <button class="btn" id="start" disabled>Start</button>
  <div id="support">Checking this device…</div>
  <p style="margin-top:22px"><a href="./">← Trainer</a></p>
</div>

<div id="overlay">
  <canvas id="draw"></canvas>
  <div id="taplayer"></div>
  <canvas id="dbg" width="120" height="120"></canvas>
  <div class="toast" id="toast"></div>
  <div class="top">
    <div class="status"><div id="status">Starting…</div><div class="steps" id="steps"><i></i><i></i><i></i><i></i></div></div>
    <button class="btn ghost small" id="exit">Exit</button>
  </div>
  <div class="bottom">
    <div class="readout" id="readout"></div>
    <div class="answers" id="answers"></div>
    <div class="row">
      <button class="btn ghost small" id="undo">Undo</button>
      <button class="btn ghost small" id="newshot">New shot</button>
      <button class="btn ghost small" id="realign">Re-align</button>
      <button class="btn ghost small" id="retable">Redo table</button>
    </div>
  </div>
</div>

<script type="module">
import {v3, m4mul, m4inv, m4point, m4identity, rayFromNDC, projectToNDC, rayPlane, tableFrom3, guessTable, shotGeometry, detectBall, rigidFit, findBalls, clothColour, R, REFS} from './ar-core.js';

const $ = id => document.getElementById(id);
const DEBUG = new URLSearchParams(location.search).has('debug');

// ---------- can this device do it? ----------
(async function(){
  const el = $('support');
  if(!window.isSecureContext){ el.textContent = 'Open this page over HTTPS.'; el.className='bad'; return; }
  let ok = false;
  try{ ok = !!navigator.xr && await navigator.xr.isSessionSupported('immersive-ar'); }catch(e){}
  if(!ok){ el.innerHTML = 'Needs Chrome on an Android phone with Google Play Services for AR.'; el.className='bad'; return; }
  el.textContent = '';
  $('start').disabled = false;
})();

// ---------- state ----------
// Everything is stored in the coordinates of the moment the table was pinned; `pin` maps those to the current world,
// so when tracking corrects itself, the table and the marks move with the real one.
let session, gl, xrLayer, refSpace, viewerSpace, hitSource, binding;
let cameraAccess = false;
let step = 'scan';            // scan → table → balls → pocket → call → reveal
let lastHit = null;           // latest surface under the screen centre {p, n, result}
let plane = null;             // the cloth {p, n} (pinned coordinates)
let anchors = [], anchorAt = [], pin = m4identity(), unpin = m4identity();   // one anchor per tapped corner, and where each was pinned
let corners = [];             // tapped corner pockets (pinned)
let table = null;
let balls = {cue: null, obj: null};   // pinned centres
let target = null;            // target pocket index
let shot = null, picked = null;
let seen = [];                // balls found in the camera picture: {p (pinned), label, cue, t}
let objLabel = '';
let camRowsDown = null;       // do the camera picture's rows run top-down? (worked out from the table itself)
let lastScan = 0;
let lastView = null;          // {proj, view}
const taps = [];              // screen taps waiting for the next frame (they need its camera image)
const history = [];           // for Undo

$('start').addEventListener('click', start);
async function start(){
  try{
    session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay', 'anchors', 'camera-access'],
      domOverlay: {root: $('overlay')}
    });
  }catch(e){ $('support').textContent = 'Couldn\'t start AR: ' + e.message; $('support').className='bad'; return; }
  $('overlay').classList.add('on'); $('intro').style.display = 'none';
  const canvas = document.createElement('canvas');
  gl = canvas.getContext('webgl', {xrCompatible: true, alpha: true, antialias: false});
  xrLayer = new XRWebGLLayer(session, gl);
  session.updateRenderState({baseLayer: xrLayer});
  refSpace = await session.requestReferenceSpace('local');
  viewerSpace = await session.requestReferenceSpace('viewer');
  hitSource = await session.requestHitTestSource({space: viewerSpace});
  try{ binding = new XRWebGLBinding(session, gl); }catch(e){ binding = null; }
  $('overlay').addEventListener('beforexrselect', e => e.preventDefault());
  session.addEventListener('end', ()=>{ session = null; $('overlay').classList.remove('on'); $('intro').style.display = ''; });
  setStep('scan');
  session.requestAnimationFrame(onFrame);
}
$('exit').addEventListener('click', ()=>{ if(session) session.end(); });

// ---------- taps ----------
$('taplayer').addEventListener('pointerdown', e=>{
  e.preventDefault();
  taps.push({x: e.clientX / innerWidth * 2 - 1, y: 1 - e.clientY / innerHeight * 2});
});

// ---------- the frame loop ----------
function onFrame(t, frame){
  if(!session) return;
  session.requestAnimationFrame(onFrame);
  gl.bindFramebuffer(gl.FRAMEBUFFER, xrLayer.framebuffer);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  const pose = frame.getViewerPose(refSpace);
  if(!pose) return;
  const view = pose.views[0];
  lastView = {proj: view.projectionMatrix, view: view.transform.inverse.matrix};

  // the surface under the screen centre, while scanning
  lastHit = null;
  if(hitSource){
    const hits = frame.getHitTestResults(hitSource);
    if(hits.length){
      const hp = hits[0].getPose(refSpace);
      if(hp){ const m = hp.transform.matrix; lastHit = {p: [m[12],m[13],m[14]], n: v3.norm([m[4],m[5],m[6]]), result: hits[0]}; }
    }
  }
  // follow the tracking system's corrections of where the table is
  // The table is rigid and never moves: tracking corrections may only slide or turn it as a whole.
  // Fit that from the three corner anchors, and ignore any update that would bend the table.
  if(anchors.length === 3 && frame.trackedAnchors){
    const now = [];
    for(const a of anchors){
      if(!frame.trackedAnchors.has(a)) break;
      const ap = frame.getPose(a.anchorSpace, refSpace); if(!ap) break;
      const m = ap.transform.matrix; now.push([m[12], m[13], m[14]]);
    }
    if(now.length === 3){
      const fit = rigidFit(anchorAt, now, plane.n);
      if(fit.residual < 0.03){ pin = fit.m; unpin = m4inv(pin) || m4identity(); }
    }
  }
  if(view.camera && binding) cameraAccess = true;
  if(table && cameraAccess && !scanBusy && t - lastScan > 400 && ['balls','pocket','call','reveal'].includes(step)){
    lastScan = t;
    try{ scanBalls(view); }catch(e){ if(DEBUG) console.warn(e); }
  }
  while(taps.length) handleTap(taps.shift(), frame, view);
  draw();
}

// pinned ↔ world
let nudge = [0,0,0];   // a manual correction (Re-align), in pinned coordinates
const toWorld = p => { const q = m4point(pin, v3.add(p, nudge)); return [q[0],q[1],q[2]]; };
const toPinned = p => { const q = m4point(unpin, p); return v3.sub([q[0],q[1],q[2]], nudge); };
function pinnedRay(ndcX, ndcY){
  const r = rayFromNDC(lastView.proj, lastView.view, ndcX, ndcY); if(!r) return null;
  const o = toPinned(r.o), e = toPinned(v3.add(r.o, r.d));
  return {o, d: v3.norm(v3.sub(e, o))};
}

function handleTap(tap, frame, view){
  if(step === 'scan'){
    if(!lastHit){ toast('Keep moving the phone over the cloth'); return; }
    plane = {p: lastHit.p, n: lastHit.n};
    setStep('table'); return;
  }
  if(step === 'table'){
    const p = rayPlane(pinnedRay(tap.x, tap.y), plane, 0);
    if(!p){ toast('Tap on the table'); return; }
    history.push(()=>{ corners.pop(); table = null; setStep('table'); });
    corners.push(p);
    if(corners.length === 3){
      table = tableFrom3(corners[0], corners[1], corners[2], plane.n);
      pinCorners(frame);
      const g = guessTable(table.len, table.wid);
      toast(`Table ${table.len.toFixed(2)} × ${table.wid.toFixed(2)} m · looks like a ${g.name}`);
      setStep('balls');
    } else setStep('table');
    return;
  }
  if(step === 'balls' || step === 'call' || step === 'reveal'){
    // a ball the scanner has already found: tap near it to choose it
    // nearest found ball on screen, within a fingertip
    const tx = (tap.x + 1) / 2 * innerWidth, ty = (1 - tap.y) / 2 * innerHeight;
    const near = shown().map(b => { const q = proj(b.p); return q ? {b, d: Math.hypot((q.x+1)/2*innerWidth - tx, (1-q.y)/2*innerHeight - ty)} : null; })
      .filter(o => o && o.d < 44).sort((a,b)=>a.d-b.d)[0];
    if(near){
      const prev = {...balls}, prevLabel = objLabel, prevTarget = target;
      history.push(()=>{ balls = prev; objLabel = prevLabel; target = prevTarget; picked = null; setStep(balls.cue && balls.obj ? 'pocket' : 'balls'); });
      if(near.b.cue) balls.cue = near.b.p;
      else {
        balls.obj = near.b.p; objLabel = near.b.label;
        const cue = shown().find(b => b.cue);
        if(cue) balls.cue = cue.p;                      // the cue ball is picked for you
      }
      picked = null; target = null;
      setStep(balls.cue && balls.obj ? 'pocket' : 'balls');
      return;
    }
    const c = findBall(tap, frame, view);
    if(!c) return;
    // the cue ball is the white one; otherwise the first ball you tap
    let slot = c.white === true ? 'cue' : c.white === false ? 'obj' : (!balls.cue ? 'cue' : 'obj');
    const other = slot === 'cue' ? 'obj' : 'cue';
    if(balls[slot] && !balls[other]) slot = other;     // colour guess already used: fill the empty one
    const prev = {...balls};
    history.push(()=>{ balls = prev; picked = null; setStep(balls.cue && balls.obj ? 'pocket' : 'balls'); });
    balls[slot] = c.p;
    picked = null;
    if(balls.cue && balls.obj) setStep(target === null ? 'pocket' : 'call'); else setStep('balls');
    return;
  }
  if(step === 'realign'){
    const p = rayPlane(pinnedRay(tap.x, tap.y), plane, 0); if(!p) return;
    let best = null, bd = Infinity;
    table.pockets.forEach(pk=>{ const d = v3.len(v3.sub(pk.p, p)); if(d < bd){ bd = d; best = pk; } });
    const d = v3.sub(p, best.p); nudge = v3.add(nudge, v3.sub(d, v3.mul(plane.n, v3.dot(d, plane.n))));
    toast('Re-aligned'); setStep(resumeStep || 'balls'); return;
  }
  if(step === 'pocket'){
    const p = rayPlane(pinnedRay(tap.x, tap.y), plane, 0); if(!p) return;
    let best = -1, bd = Infinity;
    table.pockets.forEach((pk,i)=>{ const d = v3.len(v3.sub(pk.p, p)); if(d < bd){ bd = d; best = i; } });
    if(bd > 0.35){ toast('Tap a pocket'); return; }
    history.push(()=>{ target = null; picked = null; setStep('pocket'); });
    target = best; setStep('call');
  }
}

// Pin the table: a free-standing anchor at each tapped corner (not tied to a detected surface, which ARCore keeps reshaping).
function pinCorners(frame){
  if(!frame.createAnchor || typeof XRRigidTransform === 'undefined') return;
  const pts = corners.map(toWorld);
  Promise.all(pts.map(p => frame.createAnchor(new XRRigidTransform({x:p[0], y:p[1], z:p[2], w:1}), refSpace)))
    .then(list => { anchors = list; anchorAt = corners.map(c=>c.slice()); })     // their positions in pinned coordinates
    .catch(()=>{ anchors = []; });
}
// ---------- the camera picture ----------
// Read the camera image, shrunk to at most maxW pixels wide (a small shader draws it into our own framebuffer).
let shrink = null;
function grabCamera(view, maxW){
  const tex = binding.getCameraImage(view.camera);
  const W0 = view.camera.width, H0 = view.camera.height, k = Math.min(1, maxW / Math.min(W0, H0));   // maxW: the short side
  const w = Math.max(8, Math.round(W0*k)), h = Math.max(8, Math.round(H0*k));
  if(!shrink){
    const vs = 'attribute vec2 p; varying vec2 uv; void main(){ uv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }';
    const fs = 'precision mediump float; varying vec2 uv; uniform sampler2D t; void main(){ gl_FragColor = texture2D(t, uv); }';
    const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); return o; };
    const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    shrink = {prog, buf, loc: gl.getAttribLocation(prog, 'p'), fb: gl.createFramebuffer(), tex: gl.createTexture(), w: 0, h: 0};
  }
  if(shrink.w !== w || shrink.h !== h){
    gl.bindTexture(gl.TEXTURE_2D, shrink.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    shrink.w = w; shrink.h = h;
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, shrink.fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, shrink.tex, 0);
  gl.viewport(0, 0, w, h);
  gl.useProgram(shrink.prog);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(gl.getUniformLocation(shrink.prog, 't'), 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, shrink.buf); gl.enableVertexAttribArray(shrink.loc); gl.vertexAttribPointer(shrink.loc, 2, gl.FLOAT, false, 0, 0);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  const img = new Uint8Array(w*h*4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.bindFramebuffer(gl.FRAMEBUFFER, xrLayer.framebuffer);
  let any = 0; for(let i=0;i<img.length;i+=4093) any |= img[i] | img[i+1] | img[i+2];
  if(!any) throw new Error('blank camera image');
  return {img, w, h};
}
// NDC ↔ picture pixels, for either row order
const ndcToImg = (x, y, w, h, down) => [(x + 1) / 2 * w, down ? (1 - y) / 2 * h : (y + 1) / 2 * h];
const imgToNdc = (px, py, w, h, down) => [px / w * 2 - 1, down ? 1 - py / h * 2 : py / h * 2 - 1];

// ---------- finding the balls on the table, a couple of times a second ----------
// The camera picture is read here, the searching happens in a worker so the camera view stays smooth,
// and results are placed using the camera position from the moment the picture was taken.
const worker = (()=>{ try{ return new Worker('ar-worker.js', {type: 'module'}); }catch(e){ return null; } })();
let scanBusy = false, scanId = 0;
const scanCtx = {};
function rayWith(ctx, ndcX, ndcY){
  const r = rayFromNDC(ctx.proj, ctx.view, ndcX, ndcY); if(!r) return null;
  const tp = p => v3.sub(m4point(ctx.unpin, p).slice(0,3), ctx.nudge);
  const o = tp(r.o), e = tp(v3.add(r.o, r.d));
  return {o, d: v3.norm(v3.sub(e, o))};
}
function scanBalls(view){
  if(!worker || scanBusy) return;
  const {img, w, h} = grabCamera(view, 720);
  // the playing surface, pulled in a little so the cushions and rails stay out
  const inset = 0.045, T = table;
  const inner = [[inset, inset], [T.L1 - inset, inset], [T.L1 - inset, T.L2 - inset], [inset, T.L2 - inset]]
    .map(([a, b]) => v3.add(T.origin, v3.add(v3.mul(T.ex, a), v3.mul(T.ey, b))));
  const ndc = inner.map(p => proj(p));
  if(ndc.some(q => !q)) return;
  if(camRowsDown === null){
    const devs = [true, false].map(down => { const c = clothColour(img, w, h, ndc.map(q => ndcToImg(q.x, q.y, w, h, down)), 8); return c ? c.dev : Infinity; });
    if(Math.min(...devs) < Infinity) camRowsDown = devs[0] <= devs[1];
    else return;
  }
  const poly = ndc.map(q => ndcToImg(q.x, q.y, w, h, camRowsDown));
  const ctx = {proj: Float32Array.from(lastView.proj), view: Float32Array.from(lastView.view), unpin: Float32Array.from(unpin), pin: Float32Array.from(pin), nudge: nudge.slice(), w, h, down: camRowsDown};
  const onCloth = (px, py) => { const [x, y] = imgToNdc(px, py, w, h, ctx.down); return rayPlane(rayWith(ctx, x, y), plane, R); };
  // expected ball radius, on a coarse grid over the table's part of the picture
  const focal = ctx.proj[5] * h / 2;
  const xs = poly.map(p=>p[0]), ys = poly.map(p=>p[1]);
  const x0 = Math.max(0, Math.min(...xs)), x1 = Math.min(w-1, Math.max(...xs)), y0 = Math.max(0, Math.min(...ys)), y1 = Math.min(h-1, Math.max(...ys));
  const nx = 9, ny = 9, v = new Float32Array(nx*ny);
  for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
    const p = onCloth(x0 + (x1-x0)*i/(nx-1), y0 + (y1-y0)*j/(ny-1));
    if(!p){ v[j*nx+i] = 0; continue; }
    const e = m4point(ctx.view, m4point(ctx.pin, v3.add(p, ctx.nudge)).slice(0,3));
    v[j*nx+i] = -e[2] > 0 ? focal * R / -e[2] : 0;
  }
  const id = ++scanId; scanCtx[id] = {ctx, onCloth};
  scanBusy = true;
  worker.postMessage({id, buf: img.buffer, w, h, poly, grid: {x0, y0, dx: (x1-x0)/(nx-1) || 1, dy: (y1-y0)/(ny-1) || 1, nx, ny, v}}, [img.buffer]);
  if(DEBUG) window.__lastScan = {w, h, poly};
}
if(worker) worker.onmessage = e => {
  scanBusy = false;
  const {id, balls: raw} = e.data, sc = scanCtx[id]; delete scanCtx[id];
  if(!sc || !table) return;
  mergeSeen(raw.map(b => ({p: sc.onCloth(b.x, b.y), label: b.label, cue: b.cue, wf: b.wf})).filter(b => b.p));
};
// Keep a steady picture of the table: a ball has to be seen twice before it's shown, its position is smoothed,
// its name is the one it's been given most often, and a ball out of sight for a moment (hand, cue) stays for 1.5 s.
// There's only one of each ball, and two balls can't be closer than a ball's width.
function mergeSeen(found){
  const now = performance.now(), next = [];
  for(const b of found){
    const old = seen.filter(o => !next.includes(o)).map(o => ({o, d: v3.len(v3.sub(o.p, b.p))})).filter(x => x.d < 0.045).sort((a,c)=>a.d-c.d)[0];
    if(old){
      const o = old.o;
      o.p = v3.add(v3.mul(o.p, 0.5), v3.mul(b.p, 0.5)); o.t = now; o.hits++;
      o.votes[b.cue ? 'Cue' : b.label] = (o.votes[b.cue ? 'Cue' : b.label] || 0) + 1;
      next.push(o);
    } else next.push({p: b.p, t: now, hits: 1, votes: {[b.cue ? 'Cue' : b.label]: 1}});
  }
  for(const o of seen) if(!next.includes(o) && now - o.t < 1500) next.push(o);
  // names by vote, one of each
  for(const o of next){
    const best = Object.entries(o.votes).filter(([k]) => k !== '?').sort((a,c)=>c[1]-a[1])[0];
    o.label = best ? best[0] : '?'; o.score = best ? best[1] : 0; o.cue = o.label === 'Cue';
  }
  const owner = {};
  for(const o of next) if(o.label !== '?' && (!owner[o.label] || o.score > owner[o.label].score)) owner[o.label] = o;
  for(const o of next) if(o.label !== '?' && owner[o.label] !== o){ o.label = '?'; o.cue = false; }
  // no two balls on top of each other
  const kept = [];
  for(const o of next.sort((a,c)=>c.hits-a.hits)) if(!kept.some(k => v3.len(v3.sub(k.p, o.p)) < 2*R*0.9)) kept.push(o);
  seen = kept;
  if(step === 'balls') setStep('balls');   // refresh the prompt (cue ball found or not)
}
const shown = () => seen.filter(b => b.hits >= 2);

// Find the ball under a tap: read the camera picture, look for a ball-sized blob that isn't cloth, and use its centre.
function findBall(tap, frame, view){
  const ray = pinnedRay(tap.x, tap.y);
  const guess = rayPlane(ray, plane, R);        // where the tap would be if it hit a ball's centre
  if(!guess){ toast('Tap on the table'); return null; }
  if(!(view.camera && binding)){
    toast('Placed where you tapped (this phone doesn\'t share the camera picture)');
    return {p: guess, white: null};
  }
  let img, w, h;
  try{
    const tex = binding.getCameraImage(view.camera);
    w = view.camera.width; h = view.camera.height;
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    img = new Uint8Array(w*h*4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.bindFramebuffer(gl.FRAMEBUFFER, xrLayer.framebuffer);
    gl.deleteFramebuffer(fb);
    let any = 0; for(let i=0;i<img.length;i+=4096) any |= img[i] | img[i+1] | img[i+2];
    if(!any) throw new Error('blank camera image');
  }catch(e){
    toast('Placed where you tapped (camera picture unavailable)');
    return {p: guess, white: null};
  }
  // expected size of a ball there, in camera pixels
  const P = lastView.proj;
  const eye = m4point(lastView.view, toWorld(guess)); const depth = -eye[2];
  const rExp = (P[5] * h / 2) * R / depth;
  // The picture's rows may run bottom-up or top-down; try both and keep the one that finds a ball.
  const col = (tap.x + 1) / 2 * w;
  const cands = [
    {row: (tap.y + 1) / 2 * h, toNdcY: y => y / h * 2 - 1},
    {row: (1 - tap.y) / 2 * h, toNdcY: y => 1 - y / h * 2},
  ].map(o => ({...o, d: detectBall(img, w, h, col, o.row, rExp)})).filter(o => o.d);
  if(!cands.length){ toast('No ball found there. Tap right on the ball.'); return null; }
  const best = cands.sort((a,b)=>b.d.score - a.d.score)[0];
  if(DEBUG) showDebug(img, w, h, best, rExp);
  const r2 = pinnedRay(best.d.x / w * 2 - 1, best.toNdcY(best.d.y));
  const p = rayPlane(r2, plane, R);
  if(!p) return {p: guess, white: best.d.white};
  return {p, white: best.d.white};
}
function showDebug(img, w, h, best, rExp){
  const c = $('dbg'), ctx = c.getContext('2d'); c.style.display = 'block';
  const half = Math.ceil(rExp*3), im = ctx.createImageData(120, 120);
  for(let j=0;j<120;j++) for(let i=0;i<120;i++){
    const x = Math.round(best.d.x - half + i/120*2*half), y = Math.round(best.d.y - half + j/120*2*half);
    const o = (j*120+i)*4;
    if(x<0||y<0||x>=w||y>=h) continue;
    const s = (y*w+x)*4; im.data[o]=img[s]; im.data[o+1]=img[s+1]; im.data[o+2]=img[s+2]; im.data[o+3]=255;
  }
  ctx.putImageData(im, 0, 0);
  ctx.strokeStyle = '#ff0'; ctx.beginPath(); ctx.arc(60, 60, rExp/(2*half)*120, 0, Math.PI*2); ctx.stroke();
}

// ---------- steps ----------
const STEP_TEXT = {
  scan: 'Move the phone slowly over the table. When the ring sits flat on the cloth, <b>tap</b>.',
  table: () => `Tap the <b>${['first','next','across'][corners.length]}</b> corner pocket` + (corners.length===0 ? ' (any one).' : corners.length===1 ? ', along the same rail.' : ', on the other side from that one.'),
  balls: () => (shown().some(b=>b.cue) && !balls.obj) ? 'Tap the <b>object ball</b>.' : (!balls.cue && !balls.obj && cameraAccess) ? 'Tap the <b>cue ball</b> and the <b>object ball</b>.' : `Tap the <b>${balls.cue ? 'object ball' : 'cue ball'}</b>` + (cameraAccess ? '.' : ', right in its centre.'),
  pocket: 'Tap the <b>pocket</b> you\'re aiming for.',
  call: 'How full do you hit it?',
  reveal: 'Move the balls and tap them again, or tap New shot.',
  realign: 'Tap the <b>middle of any pocket</b> to snap the table back onto it.',
};
const STEP_N = {scan:0, table:1, balls:2, pocket:3, call:4, reveal:4, realign:4};
let resumeStep = null;
function setStep(s){
  step = s;
  const t = STEP_TEXT[s]; $('status').innerHTML = typeof t === 'function' ? t() : t;
  [...$('steps').children].forEach((el,i)=>el.classList.toggle('done', i < STEP_N[s]));
  $('answers').classList.toggle('on', s === 'call' || s === 'reveal');
  $('readout').classList.toggle('on', s === 'reveal');
  $('newshot').disabled = !table; $('realign').disabled = !table; $('retable').disabled = step === 'scan';
  if(s === 'call'){ renderAnswers(); computeShot(); }
}
function computeShot(){
  shot = (balls.cue && balls.obj && target !== null) ? shotGeometry(balls.cue, balls.obj, table.pockets[target].p, plane.n) : null;
  if(shot && !shot.possible){ toast('That cut isn\'t makeable. Pick another pocket.'); target = null; setStep('pocket'); }
}
function renderAnswers(){
  $('answers').innerHTML = REFS.map(r => `<button data-id="${r.id}">${r.label}</button>`).join('');
  $('answers').querySelectorAll('button').forEach(b => b.addEventListener('click', ()=>call(b.dataset.id)));
}
function call(id){
  if(step !== 'call' || !shot) return;
  picked = id;
  const ok = id === shot.nearest.id;
  $('answers').querySelectorAll('button').forEach(b => { b.className = b.dataset.id===shot.nearest.id ? 'right' : b.dataset.id===id ? 'wrong' : ''; });
  $('readout').innerHTML = `<span class="big ${ok?'ok':'no'}">${ok ? 'Right' : 'Wrong'}</span> · ${shot.nearest.label} ball`
    + `<div class="sub">${shot.theta.toFixed(1)}° · ${shot.f.toFixed(2)} ball · ${Math.round(v3.len(v3.sub(shot.ob, shot.cb))*100)} cm apart</div>`;
  history.push(()=>{ picked = null; setStep('call'); });
  setStep('reveal');
  navigator.vibrate && navigator.vibrate(ok ? 15 : [20, 40, 20]);
}
$('realign').addEventListener('click', ()=>{ if(!table) return; if(step !== 'realign') resumeStep = step; setStep('realign'); });
$('undo').addEventListener('click', ()=>{ const f = history.pop(); if(f) f(); });
$('newshot').addEventListener('click', ()=>{ balls = {cue:null, obj:null}; objLabel = ''; target = null; picked = null; shot = null; history.length = 0; if(table) setStep('balls'); });
$('retable').addEventListener('click', ()=>{ corners = []; table = null; plane = null; anchors.forEach(a=>{ try{ a.delete(); }catch(e){} }); anchors = []; anchorAt = []; pin = m4identity(); unpin = m4identity(); nudge = [0,0,0];
  balls = {cue:null, obj:null}; seen = []; camRowsDown = null; scanBusy = false; target = null; picked = null; shot = null; history.length = 0; setStep('scan'); });

if(DEBUG) window.__ar = { get pin(){ return Array.from(pin); }, get anchors(){ return anchors.length; }, get seen(){ return seen; }, get rows(){ return camRowsDown; } };
let toastT = 0;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2200); }

// ---------- drawing (2D, over the camera view) ----------
const cv = $('draw'), ctx = cv.getContext('2d');
function sizeCanvas(){ const d = devicePixelRatio || 1; if(cv.width !== Math.round(innerWidth*d)){ cv.width = Math.round(innerWidth*d); cv.height = Math.round(innerHeight*d); } }
const S = ndc => [(ndc.x + 1) / 2 * cv.width, (1 - ndc.y) / 2 * cv.height];
function proj(pPinned){ return projectToNDC(lastView.proj, lastView.view, toWorld(pPinned)); }
function path3(points, style, width, dash){
  ctx.beginPath(); let started = false;
  for(const p of points){ const q = proj(p); if(!q){ started = false; continue; } const [x,y] = S(q); if(!started){ ctx.moveTo(x,y); started = true; } else ctx.lineTo(x,y); }
  ctx.strokeStyle = style; ctx.lineWidth = width * (devicePixelRatio||1); ctx.setLineDash(dash ? dash.map(d=>d*(devicePixelRatio||1)) : []); ctx.stroke();
}
function segment(a, b, n = 24){ const out = []; for(let i=0;i<=n;i++) out.push(v3.add(a, v3.mul(v3.sub(b,a), i/n))); return out; }
function ringOnCloth(c, r, lift = 0.002){
  const ex = table ? table.ex : v3.norm(v3.cross(plane.n, [1,0,0])), ey = v3.norm(v3.cross(plane.n, ex));
  const out = []; for(let i=0;i<=36;i++){ const a = i/36*Math.PI*2; out.push(v3.add(v3.add(c, v3.mul(plane.n, lift)), v3.add(v3.mul(ex, Math.cos(a)*r), v3.mul(ey, Math.sin(a)*r)))); }
  return out;
}
function sphere(c, fill, stroke, dash){
  const q = proj(c); if(!q) return;
  const [x,y] = S(q), r = (lastView.proj[5] * cv.height/2) * R / q.depth;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.setLineDash(dash ? dash.map(d=>d*(devicePixelRatio||1)) : []);
  if(fill){ ctx.fillStyle = fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 2*(devicePixelRatio||1); ctx.stroke(); }
}
function draw(){
  sizeCanvas(); ctx.clearRect(0, 0, cv.width, cv.height);
  if(!lastView) return;
  if(step === 'scan' && lastHit){
    const n = lastHit.n, ex = v3.norm(v3.cross(n, [0,0,1])), ey = v3.norm(v3.cross(n, ex)), out = [];
    for(let i=0;i<=36;i++){ const a = i/36*Math.PI*2; out.push(v3.add(lastHit.p, v3.add(v3.mul(ex, Math.cos(a)*0.08), v3.mul(ey, Math.sin(a)*0.08)))); }
    // the scanning ring lives in world space (no table pinned yet)
    const keep = pin; pin = m4identity(); path3(out, '#ffffff', 3); pin = keep;
  }
  if(plane && !table) for(const c of corners) path3(ringOnCloth(c, 0.06), '#ffd34d', 3);
  if(table){
    const cs = table.corners.map(c => v3.add(c, v3.mul(plane.n, 0.002)));
    path3([...segment(cs[0],cs[1]), ...segment(cs[1],cs[2]), ...segment(cs[2],cs[3]), ...segment(cs[3],cs[0])], 'rgba(255,255,255,.55)', 1.5);
    table.pockets.forEach((pk,i) => path3(ringOnCloth(pk.p, 0.06), i === target ? '#ffd34d' : 'rgba(255,255,255,.7)', i === target ? 4 : 2));
  }
  if(table && step !== 'scan' && step !== 'table'){
    const d = devicePixelRatio || 1;
    ctx.font = `600 ${13*d}px system-ui, sans-serif`; ctx.textAlign = 'center';
    for(const b of shown()){
      const chosen = balls.obj && v3.len(v3.sub(b.p, balls.obj)) < 0.03;
      const onCloth = v3.sub(b.p, v3.mul(plane.n, R));
      path3(ringOnCloth(onCloth, R*1.45), b.cue ? '#ffffff' : chosen ? '#ffd34d' : 'rgba(255,255,255,.75)', chosen || b.cue ? 3 : 2);
      const q = proj(v3.add(b.p, v3.mul(plane.n, R*2.2))); if(!q) continue;
      const [x, y] = S(q), txt = b.cue ? 'Cue' : b.label;
      ctx.lineWidth = 3*d; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.setLineDash([]); ctx.strokeText(txt, x, y);
      ctx.fillStyle = b.cue ? '#ffffff' : chosen ? '#ffd34d' : '#ffffff'; ctx.fillText(txt, x, y);
    }
  }
  if(balls.cue) sphere(balls.cue, null, '#ffffff');
  if(balls.obj) sphere(balls.obj, null, '#ffd34d');
  if(step === 'reveal' && shot){
    const lift = v => v3.add(v3.sub(v, v3.mul(plane.n, v3.dot(v3.sub(v, plane.p), plane.n))), v3.mul(plane.n, 0.003));   // down onto the cloth
    path3(segment(lift(shot.ob), lift(shot.pk)), '#ffd34d', 3, [2, 7]);
    path3(segment(lift(shot.cb), lift(v3.add(shot.gb, v3.mul(shot.v, 0.25)))), '#ffffff', 2);
    sphere(shot.gb, 'rgba(255,255,255,.25)', '#ffffff', [6, 5]);
    if(picked && picked !== shot.nearest.id){
      // where your call would have sent the cue ball in
      const ref = REFS.find(r=>r.id===picked);
      const d = (ref.deg - shot.theta) * Math.PI/180;
      const ang = u => Math.acos(Math.max(-1, Math.min(1, v3.dot(shot.v, u)))) * 180/Math.PI;
      const cands = [rotAround(shot.u, plane.n, d), rotAround(shot.u, plane.n, -d)];
      const u2 = Math.abs(ang(cands[0]) - ref.deg) < Math.abs(ang(cands[1]) - ref.deg) ? cands[0] : cands[1], g2 = v3.sub(shot.ob, v3.mul(u2, 2*R));
      sphere(g2, null, '#d9c2ff', [6, 5]);
      path3(segment(lift(shot.ob), lift(v3.add(shot.ob, v3.mul(u2, v3.len(v3.sub(shot.pk, shot.ob)))))), '#d9c2ff', 3, [2, 7]);
    }
  }
}
function rotAround(v, axis, a){   // Rodrigues
  const c = Math.cos(a), s = Math.sin(a);
  return v3.add(v3.add(v3.mul(v, c), v3.mul(v3.cross(axis, v), s)), v3.mul(axis, v3.dot(axis, v)*(1-c)));
}
</script>
